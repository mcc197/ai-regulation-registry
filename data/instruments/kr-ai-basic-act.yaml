id: kr-ai-basic-act
title: Framework Act on the Development of Artificial Intelligence and Establishment of Trust
short_title: Korea AI Basic Act
type: legislation
binding: true
jurisdiction: KR
issuer: National Assembly of the Republic of Korea
url: https://www.law.go.kr/
topics: [high-risk, generative-ai, transparency, innovation, governance]
summary: >
  Korea's comprehensive AI law. It sets national AI governance and promotion measures,
  adds duties for "high-impact" AI and generative AI (including notice and labelling),
  and requires some foreign providers to appoint a domestic representative.
milestones:
  - {date: 2024-12-26, event: adopted, scope: Passed by the National Assembly}
  - {date: 2025-01-21, event: published, scope: Promulgated}
  - date: 2026-01-22
    event: applies
    scope: Act and its Enforcement Decree (Presidential Decree No. 36053)
    note: No fines for at least the first year, under the Decree's grace period
sources:
  - {url: "https://www.law.go.kr/", label: "Korean Law Information Center (search the Act's title)", kind: official}
  - {url: "https://cset.georgetown.edu/publication/south-korea-ai-law-2025/", label: CSET English translation, kind: secondary}
  - {url: "https://www.loc.gov/item/global-legal-monitor/2026-02-20/south-korea-comprehensive-ai-legal-framework-takes-effect", label: Library of Congress, kind: secondary}
last_verified: 2026-09-27
verified_against: secondary
review_notes: >
  Still secondary only. On 2026-09-27 every official Korean host tried (www.law.go.kr,
  law.go.kr, open.law.go.kr, elaw.klri.re.kr, moleg.go.kr, msit.go.kr) was blocked by
  the network policy or dropped the connection. So the dates, the Enforcement Decree
  number, the law.go.kr deep link and the end of the fines grace period are all still
  unconfirmed. The homepage link is kept until a deep link can be opened and checked.
