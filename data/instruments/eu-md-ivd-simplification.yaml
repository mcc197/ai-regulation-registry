review_notes: >
  Checked on 2026-10-01 against the proposal text, read through the Publications Office
  (CELLAR, CELEX 52025PC1023, explanatory memorandum, recital 23 and Art. 4), and the
  Legislative Observatory. As of that date the proposal is in the Parliament's SANT
  committee (referral announced 25 Mar 2026, draft report 30 Jun 2026) with a first
  reading plenary forecast for 14 Dec 2026; the Council position is not recorded there.
  The nightly watch on the AI Act will show an "amended by" entry when this is adopted.
  No requirements are recorded until it is adopted.
