id: us-nyc-ll144
title: >-
  Local Law 144 of 2021 on automated employment decision tools (N.Y.C. Admin. Code
  ss. 20-870 to 20-874) and DCWP rules (6 RCNY ss. 5-300 to 5-304)
short_title: NYC Local Law 144 (automated employment decision tools)
type: legislation
binding: true
jurisdiction: US-NY
issuer: New York City Council; NYC Department of Consumer and Worker Protection (rules)
official_id: "Local Law 144 of 2021 (Int. 1894-2020); 6 RCNY Chapter 5, Subchapter T"
url: https://legistar.council.nyc.gov/LegislationDetail.aspx?ID=4344524&GUID=B051915D-A9AC-451E-81F8-6596032FA3F9
topics: [automated-decisions, employment, algorithmic-discrimination, transparency]
summary: >
  Employers and employment agencies may not use an automated employment decision tool
  (AEDT) to screen candidates or employees for hiring or promotion in New York City
  unless the tool has had an independent bias audit within the past year and a summary
  of the results is published. Candidates and employees who live in the city must get
  notice of the tool's use at least 10 business days in advance, including the
  qualifications and characteristics it assesses. Information about the data used and
  the data retention policy must be available. The Department of Consumer and Worker
  Protection (DCWP) enforces it with civil penalties.
