id: us-ny-raise-act
title: Responsible AI Safety and Education (RAISE) Act
short_title: New York RAISE Act
type: legislation
binding: true
jurisdiction: US-NY
issuer: New York State Legislature
official_id: "S6953-B/A6453-B, Chapter 699 of the Laws of 2025; chapter amendment S8828/A9449, Chapter 96 of the Laws of 2026 (N.Y. Gen. Bus. Law Art. 44-B, ss. 1420-1429)"
url: "https://nyassembly.gov/leg/?default_fld=&leg_video=&bn=S08828&term=2025&Summary=Y&Actions=Y&Text=Y"
topics: [frontier-models, transparency, safety-incidents]
summary: >
  Applies to developers of frontier models (foundation models trained with more than
  10^26 operations) that are developed, deployed or operated in New York. All frontier
  developers must publish transparency reports when deploying new or substantially
  modified models, and must report critical safety incidents to a new office in the
  Department of Financial Services within 72 hours. Large frontier developers (over
  $500 million in annual revenue with affiliates) must also publish a frontier AI
  framework, send quarterly summaries of internal-use catastrophic-risk assessments,
  file a disclosure statement with the office and pay assessments. The Attorney General
  can seek penalties of up to $1 million for a first violation and $3 million for later
  ones.
