id: eu-dsa-audit-delegated-regulation
title: >-
  Commission Delegated Regulation supplementing Regulation (EU) 2022/2065 by laying down
  rules on the performance of audits for very large online platforms and very large
  online search engines
short_title: EU DSA Audit Delegated Regulation
type: regulation
binding: true
jurisdiction: EU
issuer: European Commission
official_id: Commission Delegated Regulation (EU) 2024/436
url: https://eur-lex.europa.eu/eli/reg_del/2024/436/oj
topics: [risk-management, governance, transparency]
summary: >
  Sets the rules for the annual independent audits of very large online platforms and
  search engines under Art. 37 of the Digital Services Act: how the audited provider
  checks the auditor's independence and cooperates with it, the reasonable level of
  assurance the audit must reach, the audit risk analysis, audit procedures, evidence
  and sampling, specific methods for auditing risk assessment, risk mitigation and
  crisis response, and templates for the audit report and the audit implementation report.
milestones:
  - {date: 2023-10-20, event: adopted, scope: Adopted by the Commission}
  - {date: 2024-02-02, event: published, scope: "Official Journal, L series"}
  - date: 2024-02-22
    event: entry_into_force
    note: >
      Twentieth day after publication (Art. 18). No separate date of application, so it
      applies from entry into force. Our reading: audits already under way for the first
      designated services (audit period from 25 Aug 2023) were expected to follow it,
      since recital 2 aims for audits to be comparable from the DSA's date of application.
