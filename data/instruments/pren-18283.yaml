id: pren-18283
title: "Artificial Intelligence — Concepts, measures and requirements for managing bias in AI systems"
short_title: prEN 18283
type: standard
binding: false
jurisdiction: EU
issuer: CEN-CENELEC JTC 21
official_id: prEN 18283 (work item JT021036)
url: "https://standards.cencenelec.eu/ords/f?p=205:110:::::FSP_PROJECT,FSP_LANG_ID:80353,25&cs=1A0A0C0DBC7B012D69EA9AAAF8D5DFDA3"
topics: [algorithmic-discrimination, high-risk, risk-management]
summary: >
  Draft European standard on assessing and treating bias in AI systems, covering both
  data bias and system or model bias from algorithmic factors, in the context of the EU
  AI Act. Requested by the Commission (M/593, amended by M/613) to support the data and
  data governance requirements (Art. 10). Still a draft in Sept 2026: approved for
  CEN Enquiry, not yet published or cited in the Official Journal.
milestones:
