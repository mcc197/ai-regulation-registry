  - {url: "https://standards.cencenelec.eu/ords/f?p=205:22:::::FSP_ORG_ID,FSP_LANG_ID:2916257,25&cs=114251C6C0B684FBBC069923513BF6348", label: CEN-CENELEC JTC 21 work programme, kind: official}
