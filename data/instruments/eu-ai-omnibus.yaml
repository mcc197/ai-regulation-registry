id: eu-ai-omnibus
title: Digital Omnibus on AI (amending Regulations (EU) 2024/1689, (EU) 2018/1139 and (EU) 2023/1230)
short_title: EU Digital Omnibus on AI
type: legislation
binding: true
jurisdiction: EU
issuer: European Parliament and Council of the EU
official_id: Regulation (EU) 2026/1744
url: https://eur-lex.europa.eu/eli/reg/2026/1744/oj
topics: [high-risk, prohibited-practices, transparency, content-labelling, ai-literacy]
summary: >
  Amends the EU AI Act. It defers high-risk obligations to 2 December 2027 (Annex III)
  and 2 August 2028 (Annex I), gives existing systems until 2 December 2026 to meet the
  Art. 50(2) content-marking duty, and changes the Art. 4 AI literacy duty from
  ensuring a sufficient level to taking measures to support it. It also adds two
  prohibited practices from 2 December 2026: AI that generates non-consensual intimate
  imagery of identifiable people, and AI that generates child sexual abuse material.
