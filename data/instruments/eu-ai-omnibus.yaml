review_notes: >
  Checked against the Official Journal text on 2026-09-27. EUR-Lex returned a bot
  challenge, so the same OJ document was read through the Publications Office (CELLAR,
  CELEX 32026R1744); its ELI is http://data.europa.eu/eli/reg/2026/1744/oj. The text
  confirms the date of 8 Jul 2026, OJ publication on 24 Jul 2026, entry into force on
  the third day after publication (Art. 4), the new Art. 113 dates and the new
  Art. 111(4). Its procedure footnote gives Parliament's position of 16 Jun 2026 and
  the Council decision of 29 Jun 2026. The Legislative Observatory confirms the
  proposal date (19 Nov 2025) and every later step. Corrected: the political agreement
  was 7 May 2026, not 6 May (Commission AI Act page; Coreper confirmed the agreed text
  on 13 May 2026). The Council press release could not be opened (bot challenge).
