id: coe-ai-convention
title: Council of Europe Framework Convention on Artificial Intelligence and Human Rights, Democracy and the Rule of Law
short_title: CoE AI Convention
type: treaty
binding: true
jurisdiction: COE
issuer: Council of Europe
official_id: CETS No. 225
url: https://www.coe.int/en/web/conventions/full-list?module=treaty-detail&treatynum=225
topics: [human-rights, governance, public-sector]
summary: >
  First binding international treaty on AI. Parties must ensure that activities across
  the AI lifecycle are consistent with human rights, democracy and the rule of law.
  Open to non-member states.
