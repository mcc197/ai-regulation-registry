id: us-ca-ccpa-admt-regs
title: >-
  CCPA Regulations on Automated Decisionmaking Technology, Risk Assessments and
  Cybersecurity Audits (CCPA Updates, Cyber, Risk, ADMT, and Insurance Regulations)
short_title: California CCPA ADMT, risk assessment and cybersecurity audit regulations
type: regulation
binding: true
jurisdiction: US-CA
issuer: California Privacy Protection Agency (CalPrivacy)
official_id: "Cal. Code Regs. tit. 11, ss. 7001-7302 (OAL Matter No. 2025-0808-04S; OAL file Z-2024-1112-05)"
url: https://cppa.ca.gov/regulations/ccpa_updates.html
topics: [automated-decisions, consumer-protection, employment, risk-management, transparency]
summary: >
  Regulations under the California Consumer Privacy Act that add three regimes. A
  business that uses automated decisionmaking technology (ADMT) to make significant
  decisions about consumers (finance, housing, education, employment and health care)
  must give a pre-use notice and offer rights to opt out and to access information
  about the ADMT. Businesses whose processing presents significant privacy risk must
  run and document risk assessments and file summary information with the Agency.
  Businesses whose processing presents significant security risk must have an
  independent cybersecurity audit every year and certify completion to the Agency.
