review_notes: >
  Dates and scope checked against secondary sources. The official page could not be
  opened from the verification environment. Watch federal preemption: a 11 Dec 2025
  executive order directs the Attorney General to challenge state AI laws, but as of
  late Aug 2026 no statute or court had preempted or paused SB 53. The $500M revenue
  threshold for "large" developers comes from background knowledge and is not yet
