id: us-ca-sb53
title: Transparency in Frontier Artificial Intelligence Act
short_title: California SB 53 (TFAIA)
type: legislation
binding: true
jurisdiction: US-CA
issuer: California State Legislature
official_id: "SB 53 (2025), Chapter 138, Statutes of 2025"
url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB53
topics: [frontier-models, transparency, safety-incidents]
summary: >
  Applies to developers of frontier models (trained with more than 10^26 integer or
  floating-point operations). All such developers must publish a transparency report
  before deploying a new or substantially modified frontier model and report critical
  safety incidents to the state. Large frontier developers (over $500 million in annual
  revenue) must also publish a frontier AI framework, add summaries of catastrophic-risk
  assessments to their transparency reports, and send the state regular summaries of
  risk assessments of internal use. It protects whistleblowers. The Attorney General can seek civil penalties of up to
  $1 million per violation from large frontier developers.
