id: us-ca-sb53
title: Transparency in Frontier Artificial Intelligence Act
short_title: California SB 53 (TFAIA)
type: legislation
binding: true
jurisdiction: US-CA
issuer: California State Legislature
official_id: SB 53 (2025)
url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB53
topics: [frontier-models, transparency, safety-incidents]
summary: >
  Requires large developers of frontier models (trained with more than 10^26
  operations) to publish a frontier AI framework and transparency reports, report
  critical safety incidents to the state, and protect whistleblowers. The Attorney
  General enforces it, with civil penalties of up to $1 million per violation.
