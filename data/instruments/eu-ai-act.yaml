id: eu-ai-act
title: Regulation laying down harmonised rules on artificial intelligence (Artificial Intelligence Act)
short_title: EU AI Act
type: legislation
binding: true
jurisdiction: EU
issuer: European Parliament and Council of the EU
official_id: Regulation (EU) 2024/1689
url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
topics: [risk-based, high-risk, prohibited-practices, gpai, transparency, content-labelling, ai-literacy, governance]
summary: >
  Risk-based EU framework for AI. It bans certain practices, sets requirements for
  high-risk systems and their providers and deployers, sets transparency duties for
  some systems and AI-generated content, and sets obligations for general-purpose AI
  models. Application is phased. The Digital Omnibus on AI (2026/1744) moved the
  high-risk dates and added two prohibited practices.
