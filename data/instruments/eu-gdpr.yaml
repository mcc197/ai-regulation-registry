id: eu-gdpr
title: Regulation on the protection of natural persons with regard to the processing of personal data and on the free movement of such data (General Data Protection Regulation)
short_title: EU GDPR
type: legislation
binding: true
jurisdiction: EU
issuer: European Parliament and Council of the EU
official_id: Regulation (EU) 2016/679
url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
topics: [automated-decisions, risk-management, transparency, governance]
summary: >
  The EU's general data protection law. It applies to most AI systems that are trained
  on, or make decisions about, personal data. The parts recorded here are the ones AI
  work most often turns on: the right not to be subject to solely automated decisions
  with significant effects (Art. 22), the duty to explain the logic of such decisions
  (Arts. 13 to 15), data protection by design (Art. 25), and data protection impact
  assessments with prior consultation of the regulator (Arts. 35 and 36). Duties fall
  on the controller, which may be the provider or the deployer of an AI system. A
  pending Commission proposal (the Digital Omnibus, COM(2025) 837) would rewrite
  Art. 22 and add a legal basis for processing in AI development and operation.
