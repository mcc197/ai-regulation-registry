id: nist-ai-rmf
title: Artificial Intelligence Risk Management Framework (AI RMF 1.0)
short_title: NIST AI RMF
type: framework
binding: false
jurisdiction: US
issuer: National Institute of Standards and Technology
official_id: NIST AI 100-1
url: https://doi.org/10.6028/NIST.AI.100-1
topics: [risk-management, governance]
summary: >
  Voluntary framework for managing AI risk, organised around four functions: Govern,
  Map, Measure and Manage. Profiles and a companion playbook extend it.
milestones:
  - {date: 2023-01-26, event: published}
relations:
  - {type: supported_by, target: nist-ai-600-1}
sources:
  - {url: "https://www.nist.gov/itl/ai-risk-management-framework", label: NIST, kind: official, watch: true}
  - {url: "https://nvlpubs.nist.gov/nistpubs/ai/nist.ai.100-1.pdf", label: NIST AI 100-1 (PDF), kind: official}
  - {url: "https://www.gibsondunn.com/nist-releases-first-version-of-ai-risk-management-framework/", label: Gibson Dunn, kind: secondary}
last_verified: 2026-09-27
verified_against: official
review_notes: >
  Checked on 2026-09-27 against the NIST AI RMF page (released 26 Jan 2023) and the
  PDF (dated January 2023; DOI 10.6028/NIST.AI.100-1; Govern, Map, Measure and Manage).
  No newer version has been published, but NIST says the AI RMF 1.0 is being revised
  under the White House AI Action Plan. Watch for a new version. doi.org was blocked by
  the network policy, so the DOI link itself was not opened.
requirements:
  - id: govern
    ref: GOVERN function
    title: Govern
    kind: recommendation
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      A culture of risk management: policies, processes and accountability structures,
      workforce diversity and competence, engagement with affected parties, and
      management of third-party and supply-chain risk. It applies across the other
      three functions.
    evidence: [policy, training-records]
    assurance: [self-assessment]
    maps_to: [iso-iec-42001#cl-5, iso-iec-42001#a-10]
  - id: map
    ref: MAP function
    title: Map
    kind: recommendation
    category: risk-management
    roles: [organisation]
    risks: [health-safety, fundamental-rights, discrimination]
    summary: >
      Establish the context of an AI system: intended purposes, users and settings,
      categorisation, capabilities and limits, and the potential impacts on
      individuals, communities and organisations.
    evidence: [risk-register, impact-assessment]
    assurance: [self-assessment]
    maps_to: [iso-iec-42001#cl-6-1-4]
  - id: measure
    ref: MEASURE function
    title: Measure
    kind: recommendation
    category: testing-evaluation
    roles: [organisation]
    risks: [reliability, discrimination, security]
    summary: >
      Use quantitative and qualitative methods to analyse, assess, benchmark and monitor
      AI risks and trustworthiness characteristics, including independent assessment
      and tracking of risks over time.
    evidence: [test-reports]
    assurance: [self-assessment, third-party-assessment]
    assurance_note: The framework encourages independent assessors and red teams where appropriate.
  - id: manage
    ref: MANAGE function
    title: Manage
    kind: recommendation
    category: risk-management
    roles: [organisation]
    risks: [health-safety, fundamental-rights]
    summary: >
      Prioritise and act on mapped and measured risks: treatment plans, resources,
      responses to incidents, decommissioning, and monitoring of third-party
      components and post-deployment performance.
    evidence: [risk-register, incident-report, monitoring-plan]
    assurance: [self-assessment]
    maps_to: [iso-iec-42001#cl-6-1-3]
