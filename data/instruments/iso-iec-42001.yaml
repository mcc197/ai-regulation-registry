id: iso-iec-42001
title: "Information technology — Artificial intelligence — Management system"
short_title: ISO/IEC 42001
type: standard
binding: false
jurisdiction: INTL
issuer: ISO/IEC JTC 1/SC 42
official_id: ISO/IEC 42001:2023
url: https://www.iso.org/standard/81230.html
topics: [management-system, governance, risk-management]
summary: >
  Certifiable standard for an AI management system (AIMS): requirements for setting
  up, running and improving how an organisation governs the AI it develops or uses.
milestones:
  - {date: 2023-12-18, event: published}
relations:
  - {type: supported_by, target: iso-iec-42006}
  - {type: supported_by, target: iso-iec-42005}
  - {type: referenced_by, target: en-18286}
sources:
  - {url: "https://www.iso.org/standard/81230.html", label: ISO catalogue, kind: official, watch: true}
  - {url: "https://webstore.iec.ch/en/publication/90574", label: IEC webstore, kind: official}
  - {url: "https://www.dataguidance.com/news/international-iso-publishes-isoiec-420012023-ai", label: DataGuidance, kind: secondary}
last_verified: 2026-09-27
verified_against: official
review_notes: >
  Title, edition 1 and the publication date (18 Dec 2023) checked on 2026-09-27
  against the IEC webstore, an official co-publisher's catalogue. The iso.org page
  blocked the verification environment. Still the only edition as of Sept 2026 (the
  IEC lists only edition 1.0). Not checked against an official source: the European
  adoption, EN ISO/IEC 42001:2026 (said to have the same text), and ISO/IEC 42006
  (July 2025, requirements for bodies certifying 42001), which could get its own entry.
requirements:
  - id: cl-4
    ref: Clause 4
    title: Context of the organisation and AIMS scope
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      Understand the organisation and its context, including its role with respect to
      AI systems, and the needs and expectations of interested parties; determine the
      scope of the AI management system; and establish the management system itself.
    evidence: [policy]
    assurance: [internal-audit, certification]
    source: https://webstore.iec.ch/en/publication/90574
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Corrected on 2026-09-27: clause structure (4.1-4.4) checked against the official
      table of contents in the IEC webstore preview. The example roles "provider,
      producer or user" are not visible in the public preview, so the summary now says
      only "role with respect to AI systems", as the Introduction does.
  - id: cl-5
    ref: Clause 5
    title: Leadership and AI policy
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      Top management shows leadership and commitment, sets an AI policy, and assigns
      roles, responsibilities and authorities for the AI management system.
    evidence: [policy]
    assurance: [internal-audit, certification]
    source: https://webstore.iec.ch/en/publication/90574
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Corrected on 2026-09-27: sub-clauses 5.1-5.3 checked against the official table of
      contents; dropped "aligned with business objectives", which is not visible in the
      public preview.
  - id: cl-6-1-2
    ref: Clause 6.1.2
    title: AI risk assessment
    kind: control
    category: risk-management
    roles: [organisation]
    risks: [health-safety, fundamental-rights, discrimination, security]
    summary: >
      Define and apply an AI risk assessment process to identify, analyse and evaluate
      AI risks, as part of planning actions to address risks and opportunities (6.1).
    evidence: [risk-register]
    assurance: [internal-audit, certification]
    source: https://webstore.iec.ch/en/publication/90574
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Corrected on 2026-09-27: clause number and title checked against the official
      table of contents; the summary is now kept general because the clause text is not
      publicly visible.
  - id: cl-6-1-3
    ref: Clause 6.1.3
    title: AI risk treatment and statement of applicability
    kind: control
    category: risk-management
    roles: [organisation]
    risks: [health-safety, fundamental-rights, discrimination, security]
    summary: >
      Choose how to treat assessed AI risks and determine the controls needed. Annex A
      (normative) gives a reference set of control objectives and controls, with
      implementation guidance in Annex B.
    evidence: [risk-register, policy]
    assurance: [internal-audit, certification]
    source: https://webstore.iec.ch/en/publication/90574
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Corrected on 2026-09-27: clause number and title, and the normative status of
      Annexes A and B, checked against the official table of contents. The statement of
      applicability and risk treatment plan are not visible in the public preview, so
      they were taken out of the summary.
  - id: cl-6-1-4
    ref: Clause 6.1.4
    title: AI system impact assessment
    kind: control
    category: impact-assessment
    roles: [organisation]
    risks: [fundamental-rights, discrimination, privacy]
    summary: >
      Assess the potential consequences of AI systems for individuals, groups and
      society. ISO/IEC 42005:2025 gives guidance on AI system impact assessments and how
      to fit them into AI risk management and an AI management system.
    evidence: [impact-assessment]
    assurance: [internal-audit, certification]
    source: https://webstore.iec.ch/en/publication/90574
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Corrected on 2026-09-27: clause number and title checked against the official
      table of contents, and ISO/IEC 42005:2025 against its IEC webstore page
      (https://webstore.iec.ch/en/publication/107659). Dropped "use the results in risk
      assessment", which is not visible in the public preview.
