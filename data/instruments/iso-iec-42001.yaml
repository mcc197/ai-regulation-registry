id: iso-iec-42001
title: "Information technology — Artificial intelligence — Management system"
short_title: ISO/IEC 42001
type: standard
binding: false
jurisdiction: INTL
issuer: ISO/IEC JTC 1/SC 42
official_id: ISO/IEC 42001:2023
url: https://www.iso.org/standard/81230.html
topics: [management-system, governance, risk-management]
summary: >
  Certifiable standard for an AI management system (AIMS): requirements for setting
  up, running and improving how an organisation governs the AI it develops or uses.
milestones:
  - {date: 2023-12-18, event: published}
sources:
  - {url: "https://www.iso.org/standard/81230.html", label: ISO catalogue, kind: official, watch: true}
  - {url: "https://webstore.iec.ch/en/publication/90574", label: IEC webstore, kind: official}
  - {url: "https://www.dataguidance.com/news/international-iso-publishes-isoiec-420012023-ai", label: DataGuidance, kind: secondary}
last_verified: 2026-09-27
verified_against: official
review_notes: >
  Title, edition 1 and the publication date (18 Dec 2023) checked on 2026-09-27
  against the IEC webstore, an official co-publisher's catalogue. The iso.org page
  blocked the verification environment. Still the only edition as of Sept 2026 (the
  IEC lists only edition 1.0). Not checked against an official source: the European
  adoption, EN ISO/IEC 42001:2026 (said to have the same text), and ISO/IEC 42006
  (July 2025, requirements for bodies certifying 42001), which could get its own entry.
requirements:
  - id: cl-4
    ref: Clause 4
    title: Context of the organisation and AIMS scope
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      Understand internal and external issues, interested parties and the
      organisation's roles with respect to AI (for example provider, producer or user),
      and define the scope of the AI management system.
    evidence: [policy]
    assurance: [internal-audit, certification]
  - id: cl-5
    ref: Clause 5
    title: Leadership and AI policy
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      Top management shows leadership and commitment, sets an AI policy aligned with
      business objectives, and assigns responsibilities and authorities for the AI
      management system.
    evidence: [policy]
    assurance: [internal-audit, certification]
  - id: cl-6-1-2
    ref: Clause 6.1.2
    title: AI risk assessment
    kind: control
    category: risk-management
    roles: [organisation]
    risks: [health-safety, fundamental-rights, discrimination, security]
    summary: >
      Define and apply a repeatable AI risk assessment process that identifies,
      analyses and evaluates risks to the organisation and to individuals and society,
      against defined risk criteria.
    evidence: [risk-register]
    assurance: [internal-audit, certification]
  - id: cl-6-1-3
    ref: Clause 6.1.3
    title: AI risk treatment and statement of applicability
    kind: control
    category: risk-management
    roles: [organisation]
    risks: [health-safety, fundamental-rights, discrimination, security]
    summary: >
      Choose risk treatment options, determine the necessary controls (comparing them
      with Annex A), and produce a statement of applicability that justifies which
      controls are included or excluded, plus a risk treatment plan.
    evidence: [risk-register, policy]
    assurance: [internal-audit, certification]
  - id: cl-6-1-4
    ref: Clause 6.1.4
    title: AI system impact assessment
    kind: control
    category: impact-assessment
    roles: [organisation]
    risks: [fundamental-rights, discrimination, privacy]
    summary: >
      Assess the potential consequences of AI systems for individuals, groups and
      society, and use the results in risk assessment. ISO/IEC 42005 gives guidance on
      how to do it.
    evidence: [impact-assessment]
    assurance: [internal-audit, certification]
  - id: cl-7
    ref: Clause 7
    title: Support (resources, competence, awareness, documented information)
    kind: control
    category: ai-literacy
    roles: [organisation]
    risks: [reliability, accountability]
    summary: >
      Provide resources, ensure competence of people doing AI work, raise awareness of
      the AI policy, communicate, and control documented information.
    evidence: [training-records, policy]
    assurance: [internal-audit, certification]
  - id: cl-8
    ref: Clause 8
    title: Operation
    kind: control
    category: quality-management
    roles: [organisation]
    risks: [reliability]
    summary: >
      Plan and control the processes needed to meet requirements, carry out risk
      assessments and impact assessments at planned intervals or on significant change,
      and implement the risk treatment plan.
    evidence: [risk-register, impact-assessment]
    assurance: [internal-audit, certification]
  - id: cl-9-1
    ref: Clause 9.1
    title: Monitoring, measurement, analysis and evaluation
    kind: control
    category: post-market-monitoring
    roles: [organisation]
    risks: [reliability]
    summary: >
      Decide what to monitor and measure, how and when, and evaluate the performance and
      effectiveness of the AI management system.
    evidence: [monitoring-plan]
    assurance: [internal-audit, certification]
  - id: cl-9-2
    ref: Clause 9.2
    title: Internal audit
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      Run an internal audit programme at planned intervals to check the AI management
      system conforms to the organisation's own requirements and the standard, and is
      effectively implemented.
    evidence: [audit-report]
    assurance: [internal-audit]
  - id: cl-9-3
    ref: Clause 9.3
    title: Management review
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: >
      Top management reviews the AI management system at planned intervals, including
      audit results, risks, incidents and opportunities for improvement.
    evidence: [management-review]
    assurance: [internal-audit, certification]
  - id: cl-10
    ref: Clause 10
    title: Improvement, nonconformity and corrective action
    kind: control
    category: quality-management
    roles: [organisation]
    risks: [accountability]
    summary: >
      React to nonconformities, take corrective action, and continually improve the AI
      management system.
    evidence: [audit-report]
    assurance: [internal-audit, certification]
  - id: a-2
    ref: Annex A.2
    title: Policies related to AI
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: Documented AI policy, aligned with other organisational policies and reviewed regularly.
    evidence: [policy]
    assurance: [certification]
  - id: a-3
    ref: Annex A.3
    title: Internal organisation
    kind: control
    category: governance
    roles: [organisation]
    risks: [accountability]
    summary: Defined AI roles and responsibilities, and a way for people to report concerns about AI systems.
    evidence: [policy]
    assurance: [certification]
  - id: a-4
    ref: Annex A.4
    title: Resources for AI systems
    kind: control
    category: governance
    roles: [organisation]
    risks: [reliability]
    summary: Inventory and document the data, tooling, computing, system and human resources that AI systems depend on.
    evidence: [technical-documentation]
    assurance: [certification]
  - id: a-5
    ref: Annex A.5
    title: Assessing impacts of AI systems
    kind: control
    category: impact-assessment
    roles: [organisation]
    risks: [fundamental-rights, discrimination]
    summary: Process for assessing, documenting and acting on impacts of AI systems on individuals, groups and society.
    evidence: [impact-assessment]
    assurance: [certification]
  - id: a-6
    ref: Annex A.6
    title: AI system life cycle
    kind: control
    category: technical-documentation
    roles: [organisation]
    risks: [reliability, accountability]
    summary: >
      Objectives and processes for responsible design and development, requirements,
      verification and validation, deployment, operation and monitoring, technical
      documentation and event logs across the AI system life cycle.
    evidence: [technical-documentation, logs, test-reports]
    assurance: [certification]
  - id: a-7
    ref: Annex A.7
    title: Data for AI systems
    kind: control
    category: data-governance
    roles: [organisation]
    risks: [discrimination, privacy, reliability]
    summary: Data management covering acquisition, quality, provenance and preparation of data used by AI systems.
    evidence: [data-documentation]
    assurance: [certification]
  - id: a-8
    ref: Annex A.8
    title: Information for interested parties
    kind: control
    category: transparency
    roles: [organisation]
    risks: [opacity]
    summary: >
      Give users and other interested parties the information they need, provide a way
      to report adverse impacts, and communicate incidents.
    evidence: [user-notice, instructions-for-use]
    assurance: [certification]
  - id: a-9
    ref: Annex A.9
    title: Use of AI systems
    kind: control
    category: human-oversight
    roles: [organisation]
    risks: [reliability, accountability]
    summary: Processes and objectives for responsible use of AI systems, used according to their intended use.
    evidence: [policy, oversight-records]
    assurance: [certification]
  - id: a-10
    ref: Annex A.10
    title: Third-party and customer relationships
    kind: control
    category: third-party-management
    roles: [organisation]
    risks: [accountability, security]
    summary: >
      Allocate responsibilities between the organisation, its suppliers and customers,
      and make sure supplied AI components and services meet the organisation's
      approach to responsible AI.
    evidence: [policy]
    assurance: [certification]
  - id: cert
    ref: Certification
    title: Third-party certification of the AI management system
    kind: control
    category: conformity-assessment
    roles: [organisation]
    risks: [accountability]
    summary: >
      Organisations can be certified against ISO/IEC 42001 by an accredited
      certification body. ISO/IEC 42006 sets requirements for bodies that audit and
      certify AI management systems.
    evidence: [certificate, audit-report]
    assurance: [certification, third-party-assessment]
