  - id: cert
    ref: Certification
    title: Third-party certification of the AI management system
    kind: control
    category: conformity-assessment
    roles: [organisation]
    risks: [accountability]
    summary: >
      Organisations can have their AI management system certified against ISO/IEC
      42001 by a third-party certification body. ISO/IEC 42006:2025 adds to ISO/IEC
      17021-1 the requirements for bodies that audit and certify AI management systems,
      so that they show competence, consistency and reliability. It can also serve as
      the criteria for accrediting or peer-assessing those bodies.
    evidence: [certificate, audit-report]
    assurance: [certification, third-party-assessment]
    source: https://webstore.iec.ch/en/publication/108460
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Corrected on 2026-09-27 against the ISO/IEC 42006:2025 page on the IEC webstore:
      42006 supplements ISO/IEC 17021-1 and treats AIMS certification as third-party
      conformity assessment. It does not make accreditation mandatory (it "can be used"
      for accreditation), so "accredited" was dropped. The iso.org page was blocked by
      a bot check.
