id: en-18286
title: "Artificial intelligence — Quality management system for EU AI Act regulatory purposes"
short_title: EN 18286
type: standard
binding: false
jurisdiction: EU
issuer: CEN-CENELEC JTC 21
official_id: EN 18286:2026
url: "https://standards.cencenelec.eu/ords/f?cs=12A382BDB5385F509EBAA7CD4808AFBF3&p=CEN%3A110%3A%3A%3A%3A%3AFSP_PROJECT%2CFSP_ORG_ID%3A80556%2C2916257"
topics: [management-system, high-risk, governance, risk-management]
summary: >
  European standard setting requirements and guidance for the quality management system
  that providers of AI systems, chiefly high-risk AI systems, need under Art. 17 of the
  EU AI Act. Developed under standardisation request M/593 (amended by M/613) as the
  first standard in support of the AI Act. Published in July 2026; its reference had not
  been cited in the Official Journal as of Sept 2026, so it does not yet give a
  presumption of conformity under Art. 40.
