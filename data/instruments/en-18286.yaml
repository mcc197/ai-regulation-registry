    title: Management responsibility, planning and support
    kind: control
    category: governance
    roles: [provider]
    scope: Providers of AI systems, primarily high-risk AI systems
    risks: [accountability]
    summary: >
      Top management sets a quality policy and assigns roles, responsibilities and
      authorities; the provider plans actions on risks to the QMS and sets quality
      objectives; and provides resources, competence and communication, including
      communication with authorities.
    evidence: [quality-manual, policy, training-records]
    assurance: [self-assessment, third-party-assessment]
    maps_to: [eu-ai-act#art-17, iso-iec-42001#cl-5, iso-iec-42001#cl-7]
    source: https://knowledge.bsigroup.com/products/bs-en-18286-artificial-intelligence-quality-management-system-for-eu-ai-act-regulatory-purposes
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Clause titles 5.1-5.3, 6.1-6.2 and 7.1-7.3 from the official enquiry draft; BSI's
      webinar on the final text places management responsibility, planning and support
