review_notes: >
  Checked on 2026-09-27. Status, work item (JT021039), scope, mandates (M/593, M/613),
  legal act (2024/1689), DOR 2026-07-12, DAV 2026-07-22, DOA 2026-10-31 and DOP/DOW
  2027-01-31 come from the CEN-CENELEC project record, which lists the OJEU citation as
  "Citation expected for Directive 2024/1689". A query of the Publications Office
  CELLAR endpoint for acts dated from 1 Jun 2026 whose titles mention 2024/1689 found no
  implementing decision citing harmonised standards, only 2026/1744 and 2026/1755. So as
  of this date EN 18286 is published but not cited in the OJ and gives no presumption of
  conformity under AI Act Art. 40; the CEN-CENELEC newsletter says the Commission is
  expected to publish the reference later in 2026. When it does, add the OJ citation as
  a milestone with the implementing decision as its source. The Formal Vote question: CEN-CENELEC's
  newsletter of 27 May 2026 says the draft went out for Formal Vote after the harmonised
  standard review, although the Oct 2025 acceleration package allowed direct publication
  after a positive Enquiry. National adoptions seen: EVS-EN 18286:2026 (valid from
  3 Aug 2026) and BS EN 18286:2026. Requirements: the final text is paywalled and its
  only official public preview (EVS) sits behind a captcha. Clause titles therefore come
  from the official enquiry draft (prEN 18286:2025, BSI preview), and are marked verified
  only where BSI's July 2026 webinar on the final text cites the same clause number for
  the same topic. The final text has clauses the draft lacked (for example 7.4, 8.8,
  8.9 and 9.7, per the webinar), so other draft clause numbers may have moved.
requirements:
  - id: cl-4
    ref: Clause 4
    title: QMS scope, regulatory requirements and strategy for regulatory compliance
    kind: control
    category: quality-management
    roles: [provider]
    scope: Providers of AI systems, primarily high-risk AI systems
    risks: [accountability]
    summary: >
      Identify the regulatory requirements that apply, determine the scope of the
      quality management system (a defined set of AI systems), set a strategy for
      regulatory compliance, and control documented information.
    controls:
      - Register of applicable AI Act and sectoral requirements per AI system
      - Documented compliance strategy, including which conformity assessment route applies
    evidence: [quality-manual, policy]
    assurance: [self-assessment, third-party-assessment]
    assurance_note: >
      A notified body assesses the QMS where the Annex VII route applies. Presumption of
      conformity with Art. 17 only once the reference is cited in the OJ (not yet as of
      Sept 2026).
    maps_to: [eu-ai-act#art-17, iso-iec-42001#cl-4]
    source: https://knowledge.bsigroup.com/products/bs-en-18286-artificial-intelligence-quality-management-system-for-eu-ai-act-regulatory-purposes
    last_verified: 2026-09-27
    verified_against: official
    note: >
      Clause titles 4.2-4.5 from the official enquiry-draft table of contents; BSI's
      webinar on the final text cites 4.4 for the compliance strategy and lists 4.1-4.5,
      and says the QMS scope is anchored in a set of AI systems.
  - id: cl-5-7
