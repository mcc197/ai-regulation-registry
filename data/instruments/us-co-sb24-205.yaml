id: us-co-sb24-205
title: Consumer Protections for Artificial Intelligence (Colorado AI Act)
short_title: Colorado AI Act (SB 24-205)
type: legislation
binding: true
jurisdiction: US-CO
issuer: Colorado General Assembly
official_id: SB 24-205
url: https://leg.colorado.gov/bills/sb24-205
topics: [high-risk, algorithmic-discrimination, automated-decisions, consumer-protection]
summary: >
  First US state law on high-risk AI. It imposed a duty of care against algorithmic
  discrimination, risk-management programmes and impact assessments on developers and
  deployers. Its start was delayed and it never took effect. SB 26-189 replaced it.
