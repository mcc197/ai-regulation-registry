issuer: Colorado General Assembly
official_id: SB 26-189
url: https://leg.colorado.gov/bills/sb26-189
topics: [automated-decisions, consumer-protection, employment, transparency]
summary: >
  Replaces the Colorado AI Act with a narrower regime for automated decision-making
  technology (ADMT) used in consequential decisions. It requires a notice before use
  and a disclosure after an adverse outcome, and gives consumers limited rights. It
  drops the earlier duty of care, risk-management programme and impact assessments.
