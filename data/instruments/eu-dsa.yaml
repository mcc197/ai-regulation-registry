    note: >
      Art. 24(2), (3) and (6), Art. 33(3) to (6), Art. 37(7), Art. 40(13), Art. 43 and
      Sections 4 to 6 of Chapter IV (enforcement) applied from this date (Art. 93(2)),
      so the Commission could designate VLOPs and VLOSEs and adopt the audit delegated act.
  - date: 2023-08-25
    event: applies
    scope: "Section 5 of Chapter III (Arts 34 to 43) and the rest of the Regulation, for the 17 VLOPs and 2 VLOSEs designated on 25 Apr 2023"
    note: >
      The first designations (Art. 33(4)) were adopted on 25 Apr 2023. They are not
      recorded as a milestone of their own because a designation is a Commission decision,
      not a lifecycle stage of the Regulation, and an `adopted` event would read as the
      Regulation's status after entry into force.
      Four months after notification of the designation (Art. 33(6) and Art. 92). Our
      reading: the Commission's 25 Apr 2023 press release says the designated services
      must comply "within four months", which gives 25 Aug 2023; each provider's exact
      date runs from its own notification. Later designations follow the same four-month rule.
