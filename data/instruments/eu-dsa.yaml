id: eu-dsa
title: Regulation on a Single Market for Digital Services and amending Directive 2000/31/EC (Digital Services Act)
short_title: EU Digital Services Act
type: legislation
binding: true
jurisdiction: EU
issuer: European Parliament and Council of the EU
official_id: Regulation (EU) 2022/2065
url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj
topics: [risk-management, transparency, governance, generative-ai, human-rights, consumer-protection]
summary: >
  EU rules for intermediary services, online platforms and search engines. Platforms
  and search engines with at least 45 million average monthly active users in the EU
  that the Commission designates as very large online platforms (VLOPs) or search
  engines (VLOSEs) must assess and mitigate systemic risks, including those stemming
  from recommender and other algorithmic systems, undergo an annual independent audit,
  give vetted researchers data access, keep an independent compliance function and
  publish their risk assessment and audit reports. This entry covers only those parts
  relevant to AI governance and assurance.
