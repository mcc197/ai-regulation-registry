id: eu-digital-omnibus
title: Proposal amending the GDPR and other digital laws as regards the simplification of the digital legislative framework (Digital Omnibus)
short_title: EU Digital Omnibus (data) proposal
type: legislation
binding: true
jurisdiction: EU
issuer: European Commission (proposal to the European Parliament and Council)
official_id: COM(2025) 837, procedure 2025/0360(COD)
url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0837
topics: [automated-decisions, governance, innovation]
summary: >
  Commission proposal, not yet adopted, published with the Digital Omnibus on AI.
  Among many changes to EU data and cyber laws, it would amend the GDPR in ways that
  matter for AI: a new Art. 88c letting controllers rely on legitimate interests to
  process personal data for developing and operating AI systems and models, with
  safeguards and an unconditional right to object; a new Art. 9(2)(k) and 9(5) on
  special category data that turns up in AI training data, which must be removed or
  protected; Art. 22 recast as a rule that solely automated decisions are allowed only
  where necessary for a contract, authorised by law or based on explicit consent; and
  EU-level lists, template and method for data protection impact assessments.
