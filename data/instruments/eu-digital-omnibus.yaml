review_notes: >
  Checked on 2026-10-01 against the proposal text read through the Publications Office
  (CELLAR, CELEX 52025PC0837, Art. 3 amending Regulation (EU) 2016/679) and the
  Legislative Observatory. As of that date it awaits a committee decision in the
  Parliament (referral announced 19 Jan 2026, joint committee); no Council position is
  recorded there. The proposal also amends the ePrivacy Directive, the Data Act, NIS2
  and others, which are not in this register. No requirements are recorded until it is
  adopted; the nightly watch on the GDPR will show an "amended by" entry when it is.
